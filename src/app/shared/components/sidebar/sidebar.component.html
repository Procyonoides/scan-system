<aside class="sidebar-shell">
  <div class="sidebar-user">
    <div class="user-avatar"><mat-icon>person</mat-icon></div>
    <div class="user-info sidebar-label">
      <strong>{{ authService.currentUser()?.username }}</strong>
      <span><i class="status-dot"></i> Online</span>
    </div>
  </div>

  <div class="sidebar-section sidebar-label">Menu</div>

  <mat-nav-list class="sidebar-nav">
    <ng-container *ngFor="let item of menuItems">
      <a *ngIf="!item.children && hasPermission(item.roles)"
         mat-list-item
         [routerLink]="item.route"
         routerLinkActive="active"
         [routerLinkActiveOptions]="{ exact: true }"
         [title]="isCollapsed() ? item.label : ''">
        <mat-icon matListItemIcon>{{ item.icon }}</mat-icon>
        <span matListItemTitle class="sidebar-label">{{ item.label }}</span>
      </a>

      <button *ngIf="item.children && hasPermission(item.roles)"
              mat-list-item
              type="button"
              class="submenu-trigger"
              [class.expanded]="isMenuExpanded(item.label)"
              (click)="toggleMenu(item.label, $event)"
              [title]="isCollapsed() ? item.label : ''">
        <mat-icon matListItemIcon>{{ item.icon }}</mat-icon>
        <span matListItemTitle class="sidebar-label">{{ item.label }}</span>
        <mat-icon class="submenu-chevron sidebar-label">chevron_right</mat-icon>
      </button>

      <div *ngIf="item.children && isMenuExpanded(item.label)" class="submenu-list">
        <a *ngFor="let child of item.children"
           mat-list-item
           [routerLink]="child.route"
           routerLinkActive="active"
           [routerLinkActiveOptions]="{ exact: true }">
          <mat-icon matListItemIcon>{{ child.icon }}</mat-icon>
          <span matListItemTitle>{{ child.label }}</span>
        </a>
      </div>
    </ng-container>
  </mat-nav-list>

  <div class="sidebar-help">
    <mat-icon>help_outline</mat-icon>
    <span class="sidebar-label">Need Help?</span>
  </div>
</aside>
