<aside class="sidebar-shell" [class.collapsed]="isCollapsed()">
  <div class="sidebar-user">
    <div class="user-avatar"><mat-icon>person</mat-icon></div>
    <div class="user-info" *ngIf="!isCollapsed()">
      <strong>{{ authService.currentUser()?.username }}</strong>
      <span><i class="status-dot"></i> Online</span>
    </div>
  </div>

  <div class="sidebar-section" *ngIf="!isCollapsed()">Menu</div>

  <nav class="sidebar-nav">
    <ng-container *ngFor="let item of menuItems">
      <a *ngIf="!item.children && hasPermission(item.roles)"
         [routerLink]="item.route"
         routerLinkActive="active"
         [routerLinkActiveOptions]="{ exact: true }"
         class="nav-item"
         [title]="isCollapsed() ? item.label : ''">
        <mat-icon class="nav-icon">{{ item.icon }}</mat-icon>
        <span class="nav-label" *ngIf="!isCollapsed()">{{ item.label }}</span>
      </a>

      <div *ngIf="item.children && hasPermission(item.roles)"
           class="submenu-wrapper"
           (mouseenter)="onMenuEnter(item, $event)"
           (mouseleave)="onMenuLeave(item)">
        <button type="button"
                class="nav-item submenu-trigger"
                [class.expanded]="isMenuExpanded(item.label)"
                [class.active]="isParentActive(item)"
                (click)="toggleMenu(item.label, $event)"
                [title]="isCollapsed() ? item.label : ''">
          <mat-icon class="nav-icon">{{ item.icon }}</mat-icon>
          <span class="nav-label" *ngIf="!isCollapsed()">{{ item.label }}</span>
          <mat-icon class="submenu-chevron" *ngIf="!isCollapsed()">chevron_right</mat-icon>
        </button>

        <div *ngIf="isMenuExpanded(item.label)"
             class="submenu-list"
             [style.top.px]="isCollapsed() ? flyoutPosition.top : null"
             [style.left.px]="isCollapsed() ? flyoutPosition.left : null">
          <a *ngFor="let child of item.children"
             [routerLink]="child.route"
             routerLinkActive="active"
             [routerLinkActiveOptions]="{ exact: true }"
             class="nav-item">
            <mat-icon class="nav-icon">{{ child.icon }}</mat-icon>
            <span class="nav-label">{{ child.label }}</span>
          </a>
        </div>
      </div>
    </ng-container>
  </nav>

  <div class="sidebar-help">
    <mat-icon>help_outline</mat-icon>
    <span class="sidebar-label" *ngIf="!isCollapsed()">Need Help?</span>
  </div>
</aside>
