<div class="layout-container">
  <app-navbar></app-navbar>
  
  <mat-sidenav-container class="layout-body" [hasBackdrop]="isMobile()">
    <mat-sidenav class="app-sidenav"
                 [mode]="isMobile() ? 'over' : 'side'"
                 [opened]="isMobile() ? !sidebarState.collapsed() : true"
                 [class.sidebar-collapsed]="!isMobile() && sidebarState.collapsed()">
      <app-sidebar></app-sidebar>
    </mat-sidenav>

    <mat-sidenav-content class="layout-content">
      <div *ngIf="authService.isActingAs()" class="act-as-banner">
        <i class="fas fa-user-secret me-2"></i>
        Kamu sedang bertindak sebagai <strong class="m-1">{{ authService.currentUser()?.username }}</strong>
        ({{ authService.currentUser()?.realUsername }} - IT)
        <button class="btn btn-sm btn-dark ms-3" (click)="onExitActAs()">
          <i class="fas fa-sign-out-alt me-1"></i> Keluar mode Act-as
        </button>
      </div>
      <div class="content-area">
        <router-outlet></router-outlet>
      </div>
      <app-footer></app-footer>
    </mat-sidenav-content>
  </mat-sidenav-container>
</div>
